name: Issue 2868 A-star distance-cost experimental qualification

on:
  push:
    branches: [evidence/2868-source-derived-proof]
    paths:
      - '.github/workflows/issue2868-distance-cost-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-board:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WALL_BUDGET_SECONDS: '1650'
      MAX_STEPS: '30000000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/2868-distance-cost-0p2
      - uses: actions/checkout@v4
        with:
          ref: evidence/2868-source-derived-proof
          path: issue2868-repro
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Download exact original with SHA-256 integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/repros issue2868-distance-evidence
          cp issue2868-repro/scripts/repros/issue2868-qualify.ts scripts/repros/
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 150 -o /tmp/issue2868.zip \
            https://github.com/user-attachments/files/33037296/scanner-full-board.simple-route.zip
          unzip -jo /tmp/issue2868.zip scanner-full-board.simple-route.json -d /tmp
          echo '471334fad7b86e550ad1e5b9aae796665957512c78d6cc58f58fd2f8f11d28ca  /tmp/scanner-full-board.simple-route.json' | sha256sum -c -
          echo "SRJ_FILE=/tmp/scanner-full-board.simple-route.json" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee issue2868-distance-evidence/code-revision.txt
          grep -n 'DISTANCE_TO_COST: 0.2' lib/solvers/PortPointPathingSolver/tinyhypergraph/TinyHypergraphPortPointPathingSolver.ts | tee -a issue2868-distance-evidence/code-revision.txt
      - name: Bounded original board path search and DRC integrity
        id: routing
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=15s 1730s bun scripts/repros/issue2868-qualify.ts 2>&1 | tee issue2868-distance-evidence/qualification.jsonl
          exit "${PIPESTATUS[0]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2868-original-distance0p2-evidence
          path: issue2868-distance-evidence/
          retention-days: 30
      - if: steps.routing.outcome == 'failure'
        run: |
          echo 'Experimental routing did not electrically qualify; do not merge this parameter change.'
          exit 1
