name: Issue 2868 differential multi-net congestion diagnosis

on:
  push:
    branches: [evidence/2868-source-derived-proof]
    paths:
      - '.github/workflows/issue2868-multi-net-differential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-route:
    strategy:
      fail-fast: false
      matrix:
        case: [ground-plus-power, all-except-power]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WALL_BUDGET_SECONDS: '2400'
      MAX_STEPS: '30000000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/2868-combined-verification
      - uses: actions/checkout@v4
        with:
          ref: evidence/2868-source-derived-proof
          path: issue2868-evidence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Acquire and verify true six-layer original source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 150 -o /tmp/issue2868.zip \
            https://github.com/user-attachments/files/33037296/scanner-full-board.simple-route.zip
          unzip -jo /tmp/issue2868.zip scanner-full-board.simple-route.json -d /tmp
          echo '471334fad7b86e550ad1e5b9aae796665957512c78d6cc58f58fd2f8f11d28ca  /tmp/scanner-full-board.simple-route.json' | sha256sum -c -
          mkdir -p scripts/repros issue2868-differential-evidence
          cp issue2868-evidence/scripts/repros/issue2868-qualify.ts scripts/repros/
          if [ '${{ matrix.case }}' = ground-plus-power ]; then
            node issue2868-evidence/scripts/repros/issue2868-isolate-net-set.cjs /tmp/scanner-full-board.simple-route.json /tmp/reduced-board.json --only source_net_144,source_net_0
            echo '9d1c02ca45da66273be86510726f31aa180c39dba005605bf0238f5fa4433f45  /tmp/reduced-board.json' | sha256sum -c -
          else
            node issue2868-evidence/scripts/repros/issue2868-isolate-net-set.cjs /tmp/scanner-full-board.simple-route.json /tmp/reduced-board.json --exclude source_net_0
            echo 'e1a3eeb42c0f73e475488c20d1a266314e687ad0b2cb0b84e26002ecc89afe47  /tmp/reduced-board.json' | sha256sum -c -
          fi
          echo "SRJ_FILE=/tmp/reduced-board.json" >> "$GITHUB_ENV"
          echo "Candidate source commit $(git rev-parse HEAD)" | tee issue2868-differential-evidence/context.txt
          echo "Case ${{ matrix.case }}" | tee -a issue2868-differential-evidence/context.txt
          free -h
      - name: Run bounded pathing and electrical-integrity diagnostics
        shell: bash
        id: routing
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=15s 2500s bun scripts/repros/issue2868-qualify.ts 2>&1 | tee issue2868-differential-evidence/qualification.jsonl
          code=${PIPESTATUS[0]}
          echo "EXIT_CODE=$code" >> issue2868-differential-evidence/context.txt
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2868-${{ matrix.case }}-evidence
          path: issue2868-differential-evidence/
          retention-days: 30
      - if: steps.routing.outcome == 'failure'
        run: |
          echo 'Case did not electrically qualify; see evidence for exact reason'
          exit 1
