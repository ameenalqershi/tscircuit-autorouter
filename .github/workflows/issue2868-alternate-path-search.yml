name: Issue 2868 original board alternate path search A/B

on:
  push:
    branches: [evidence/2868-source-derived-proof]
    paths:
      - '.github/workflows/issue2868-alternate-path-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alternate-full-board:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      WALL_BUDGET_SECONDS: '1760'
      MAX_STEPS: '30000000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/2868-direct-rerip-search
      - uses: actions/checkout@v4
        with:
          ref: evidence/2868-source-derived-proof
          path: issue2868-repro
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Exact six-layer original and diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/repros issue2868-alternate-evidence
          cp issue2868-repro/scripts/repros/issue2868-qualify.ts scripts/repros/
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 150 -o /tmp/issue2868.zip \
            https://github.com/user-attachments/files/33037296/scanner-full-board.simple-route.zip
          unzip -jo /tmp/issue2868.zip scanner-full-board.simple-route.json -d /tmp
          echo '471334fad7b86e550ad1e5b9aae796665957512c78d6cc58f58fd2f8f11d28ca  /tmp/scanner-full-board.simple-route.json' | sha256sum -c -
          echo "SRJ_FILE=/tmp/scanner-full-board.simple-route.json" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee issue2868-alternate-evidence/revision.txt
          grep -n 'USE_PREPARED_PORT_POINT_ROUTING: false' lib/autorouter-pipelines/AutoroutingPipeline9_PreloadedTraceGraph/AutoroutingPipelineSolver9_PreloadedTraceGraph.ts | tee -a issue2868-alternate-evidence/revision.txt
      - name: Exact board qualification, routes and DRC
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=15s 1850s bun scripts/repros/issue2868-qualify.ts 2>&1 | tee issue2868-alternate-evidence/full-board.jsonl
          exit "${PIPESTATUS[0]}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2868-original-alternate-pathing-evidence
          path: issue2868-alternate-evidence/
          retention-days: 30
      - if: steps.test.outcome == 'failure'
        run: |
          echo 'Alternative path search did not achieve full DRC qualification.'
          exit 1
